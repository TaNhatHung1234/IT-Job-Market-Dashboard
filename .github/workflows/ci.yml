name: IT Job Market Dashboard CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/it-job-market-dashboard run lint
      - run: pnpm --filter @workspace/it-job-market-dashboard run test
      - run: pnpm --filter @workspace/it-job-market-dashboard run typecheck
      - run: pnpm --filter @workspace/it-job-market-dashboard run build
