name: Dashboard CI
on:
  push:
    paths:
      - 'artifacts/it-job-market-dashboard/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'artifacts/it-job-market-dashboard/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @workspace/it-job-market-dashboard lint
      - run: pnpm --filter @workspace/it-job-market-dashboard test
      - run: pnpm --filter @workspace/it-job-market-dashboard typecheck
      - run: pnpm --filter @workspace/it-job-market-dashboard build
